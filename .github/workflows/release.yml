# Publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The release notes are the matching "## [x.y.z]" section of CHANGELOG.md, and
# the asset is the built extension (dist/) for Tinycast's "Add from folder".
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # no cache in a release job (cache poisoning)

      # Same as Tinycast's "Install from GitHub": no dependency install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Runs before typecheck: it generates raycast-env.d.ts (Preferences types).
      - name: Build
        run: npx ray build -e dist -o dist

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          npx eslint src
          npx prettier --check src

      - name: Test
        run: npm test

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv dist aws-granted
          zip -r "aws-granted-${TAG}.zip" aws-granted -x '*.map'
          sha256sum "aws-granted-${TAG}.zip" > "aws-granted-${TAG}.zip.sha256"

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            "aws-granted-${TAG}.zip" "aws-granted-${TAG}.zip.sha256"
