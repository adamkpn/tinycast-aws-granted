# Checks every pull request and every push to main with the same steps the
# release workflow runs, so a broken dependency bump is caught before merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Same as Tinycast's "Install from GitHub": no dependency install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Runs before typecheck: it generates raycast-env.d.ts (Preferences types).
      - name: Build
        run: npx ray build -e dist -o dist

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          npx eslint src
          npx prettier --check src

      - name: Test
        run: npm test
